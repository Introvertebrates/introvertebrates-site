name: Publish Kryp & Krabater weekly animal

on:
  schedule:
    - cron: "15 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kryp-weekly-publishing
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the next queued article
        run: node tools/publish-next-kryp-weekly.mjs

      - name: Check local links and assets
        run: node tools/check-local-references.mjs

      - name: Commit the weekly article when the queue changed
        id: publish
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- _kryp_weekly _kryp_weekly_queue)" ]]; then
            echo "No queued article was available."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _kryp_weekly _kryp_weekly_queue
          git commit -m "Publish Kryp & Krabater weekly animal"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Request the GitHub Pages rebuild
        if: steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28"
