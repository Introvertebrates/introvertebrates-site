name: Publish Kryp & Krabater weekly animal

on:
  schedule:
    # Publish only after 10:00 Europe/Oslo (the Jekyll article timestamp).
    # Many independent off-peak-minute retries mitigate GitHub dropping cron events.
    # Monday checks backfill Sunday's issue if all Sunday attempts were missed.
    - cron: "7,22,37,52 10-13 * * 0"
      timezone: "Europe/Oslo"
    - cron: "17,47 10,12 * * 1"
      timezone: "Europe/Oslo"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kryp-weekly-publishing
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check weekly publishing safeguards
        run: node --test tools/weekly-calendar.test.mjs tools/media-decisions.test.mjs tools/colouring-print.test.mjs

      - name: Publish the next queued article
        id: prepare
        run: node tools/publish-next-kryp-weekly.mjs ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Check local links and assets
        run: node tools/check-local-references.mjs

      - name: Commit the weekly article when the queue changed
        id: publish
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- _kryp_weekly _kryp_weekly_queue)" ]]; then
            echo "No queue change (either already published or outside the release window)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _kryp_weekly _kryp_weekly_queue
          git commit -m "Publish Kryp & Krabater weekly animal"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild if needed and verify the public article
        if: steps.prepare.outputs.article_url != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTICLE_URL: ${{ steps.prepare.outputs.article_url }}
          NEWLY_PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          request_rebuild() {
            echo "Requesting GitHub Pages rebuild for $ARTICLE_URL"
            curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 5 \
              --request POST \
              --url "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28"
          }
          live_status() {
            curl --location --silent --show-error --output /dev/null \
              --connect-timeout 10 --max-time 25 --write-out "%{http_code}" "$ARTICLE_URL" || true
          }
          if [[ "$NEWLY_PUBLISHED" == "true" ]]; then
            request_rebuild
          else
            status="$(live_status)"
            if [[ "$status" == "200" ]]; then
              echo "Already live: $ARTICLE_URL"
              exit 0
            fi
            echo "Article is in GitHub but currently returns HTTP $status. Repairing deployment."
            request_rebuild
          fi
          for attempt in {1..12}; do
            sleep 20
            status="$(live_status)"
            if [[ "$status" == "200" ]]; then
              echo "Verified public article: $ARTICLE_URL"
              exit 0
            fi
            echo "Check $attempt/12: HTTP $status; waiting for Pages deployment."
          done
          echo "::error::The weekly article has not appeared at $ARTICLE_URL. Publishing needs attention."
          exit 1
