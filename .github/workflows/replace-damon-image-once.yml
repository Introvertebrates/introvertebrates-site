name: Install approved Damon colouring sheet

on:
  push:
    paths:
      - 'assets/kryp/colouring/_damon-approved-staged.tiff'

permissions:
  contents: write
  pages: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion library
        run: python -m pip install --quiet Pillow
      - name: Convert approved artwork to the public PNG and refresh both references
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          import re
          source = Path('assets/kryp/colouring/_damon-approved-staged.tiff')
          target = Path('assets/kryp/colouring/damon-weekly.png')
          if not source.exists():
              raise SystemExit('Approved staging artwork missing')
          image = Image.open(source).convert('1')
          if image.size != (900, 1125):
              raise SystemExit(f'Unexpected staged dimensions: {image.size}')
          image = image.resize((1122, 1402), Image.Resampling.NEAREST)
          image.save(target, format='PNG', optimize=True)
          data = target.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Result was not PNG')
          version = hashlib.sha256(data).hexdigest()[:12]
          for filename in ('kryp-fargelegging.html','_kryp_weekly/2026-10-25-damon-kjenner-rommet.md'):
              page = Path(filename)
              original = page.read_text()
              changed, count = re.subn(r'(damon-weekly\.png)(?:\?v=[a-zA-Z0-9]+)?', r'\g<1>?v=' + version, original)
              if count < 1:
                  raise SystemExit(f'Missing Damon image link in {filename}')
              page.write_text(changed)
          print(f'Converted and verified Damon PNG {image.size}, {len(data)} bytes, v={version}')
          PY
      - name: Commit approved image and remove temporary file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm assets/kryp/colouring/_damon-approved-staged.tiff
          git add assets/kryp/colouring/damon-weekly.png kryp-fargelegging.html _kryp_weekly/2026-10-25-damon-kjenner-rommet.md
          git commit -m "Install approved Damon colouring sheet and refresh cached images"
          git push
      - name: Request GitHub Pages build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 10 \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28"
