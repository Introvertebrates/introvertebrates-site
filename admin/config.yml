backend:
  name: github
  repo: Introvertebrates/introvertebrates-site
  branch: main
  base_url: https://curly-glitter-3880.erlend-706.workers.dev
  auth_endpoint: /auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://introvertebrates.com
display_url: https://introvertebrates.com

collections:
  - name: "kryp_weekly"
    label: "Kryp & Krabater · Ukas dyr"
    label_singular: "Ukas dyr-artikkel"
    folder: "_kryp_weekly"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "kryp/ukas-dyr/{{slug}}"
    summary: "{{date}} · {{title}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "kryp_weekly_article" }
      - { label: "Tittel", name: "title", widget: "string" }
      - { label: "Kort beskrivelse", name: "description", widget: "text", hint: "Brukes av Google og når artikkelen deles." }
      - { label: "Publiseringsdato", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss ZZ", date_format: "D. MMMM YYYY", time_format: "HH:mm" }
      - { label: "Synlig ukemerke", name: "date_label", widget: "string", hint: "For eksempel: Uke 35 · 30. august 2026" }
      - { label: "Kort introduksjon", name: "intro", widget: "text" }
      - { label: "Tinas spørsmål", name: "question", widget: "text" }
      - { label: "Hovedbilde", name: "image", widget: "image", hint: "Bruk bare et bilde Erlend eier. Et liggende 3:2-bilde fungerer best." }
      - { label: "Alternativ bildetekst", name: "image_alt", widget: "string" }
      - { label: "Bildetekst", name: "image_caption", widget: "string", required: false }
      - { label: "Videre lenke", name: "link_url", widget: "string", hint: "For eksempel: /kryp-spor-krypenes-verden.html" }
      - { label: "Lenketekst", name: "link_label", widget: "string" }
      - { label: "Artikkel", name: "body", widget: "markdown" }

  - name: "research"
    label: "Research Updates"
    folder: "_research"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "research/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["Behavior", "New species / Taxonomy", "General arachnology news", "Ecology", "Venom", "Captive relevance"] }
      - { label: "Posted date", name: "posted_date", widget: "datetime", format: "YYYY-MM-DD", date_format: "D MMMM YYYY", time_format: false }
      - { label: "Source date", name: "source_date", widget: "datetime", format: "YYYY-MM-DD", date_format: "D MMMM YYYY", time_format: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Why it matters", name: "why_it_matters", widget: "text" }
      - { label: "Source URL", name: "source_url", widget: "string" }
      - { label: "Source name", name: "source_name", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }
