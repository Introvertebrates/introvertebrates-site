  <path d="M-44 -8 C-42 -32 -25 -42 0 -39 L0 87 C-29 86 -52 52 -44 -8Z" fill="#473225"/>
  <path d="M44 -8 C42 -32 25 -42 0 -39 L0 87 C29 86 52 52 44 -8Z" fill="#473225"/>
  <path d="M-43 11 Q-28 1 -12 14 L-4 79 Q-30 66 -37 37 M43 11 Q28 1 12 14 L4 79 Q30 66 37 37" fill="#5e3b2c"/>
