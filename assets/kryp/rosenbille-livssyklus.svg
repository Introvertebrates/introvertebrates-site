  <g fill="none" stroke="#704b31" stroke-width="5" stroke-linecap="round">
    <path d="M61 27 L49 48 L37 50 M70 28 L70 49 L82 52 M48 25 L31 33 L20 29"/>
  </g>
</g>
<!-- Free beetle pupa, with wing pads, folded legs and segmented abdomen, not a butterfly chrysalis. -->
