    <path d="M-16 -47 Q-31 -46 -42 -30 M16 -47 Q31 -46 42 -30 M-14 -30 Q-24 -8 -35 4 M14 -30 Q24 -8 35 4"/>
  </g>
  <path d="M-20 -69 Q0 -80 20 -69" fill="none" stroke="#fff0cd" stroke-width="6" stroke-linecap="round"/>
</g>
