<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="384" viewBox="0 0 1056 384" role="img" aria-labelledby="title desc">
<title id="title">Rosenbillens livssyklus: egg, larve, puppe og voksen bille</title>
<desc id="desc">En forenklet illustrasjon med fire stadier. Et lyst egg, en krumbøyd lys larve med brunt hode, en lys puppe med synlige kroppsdeler og en brun-og-gul voksen rosenbille. Pilene viser rekkefølgen.</desc>
<defs>
  <linearGradient id="shell" x2="0" y2="1"><stop stop-color="#ffe6a2"/><stop offset="1" stop-color="#e3a34d"/></linearGradient>
  <linearGradient id="pale" x2="0" y2="1"><stop stop-color="#ffefce"/><stop offset="1" stop-color="#e8ca8a"/></linearGradient>
</defs>
<rect width="1056" height="384" rx="22" fill="#fbf7ea"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <g fill="#f1f3e7" stroke="#d5e2cc" stroke-width="2">
    <rect x="16" y="16" width="244" height="352" rx="20"/>
    <rect x="276" y="16" width="244" height="352" rx="20"/>
    <rect x="536" y="16" width="244" height="352" rx="20"/>
    <rect x="796" y="16" width="244" height="352" rx="20"/>
  </g>
  <g fill="#224e30" font-size="27" font-weight="bold">
    <text x="138" y="58">1. Egg</text>
    <text x="398" y="58">2. Larve</text>
    <text x="658" y="58">3. Puppe</text>
    <text x="918" y="58">4. Voksen bille</text>
  </g>
</g>
<!-- Eggs resting among a little leaf litter. -->
<g transform="translate(138 191)">
  <path d="M-77 52 Q-8 37 73 53" fill="none" stroke="#8c9868" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="-19" cy="4" rx="32" ry="46" transform="rotate(-14 -19 4)" fill="url(#pale)" stroke="#b89465" stroke-width="3"/>
  <ellipse cx="31" cy="23" rx="29" ry="39" transform="rotate(15 31 23)" fill="#fae4b1" stroke="#b89465" stroke-width="3"/>
  <path d="M-33 -18 Q-19 -32 -5 -12 M20 3 Q29 -7 40 5" fill="none" stroke="#fff8df" stroke-width="6" stroke-linecap="round"/>
  <path d="M-77 56 Q-54 38 -38 56 M41 56 Q60 42 77 57" fill="none" stroke="#65844b" stroke-width="5" stroke-linecap="round"/>
</g>
