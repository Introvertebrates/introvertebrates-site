<g fill="none" stroke="#4d914b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M262 183 H275 M268 176 L275 183 L268 190"/>
  <path d="M522 183 H535 M528 176 L535 183 L528 190"/>
  <path d="M782 183 H795 M788 176 L795 183 L788 190"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" fill="#264836" font-size="18" text-anchor="middle">
  <text x="138" y="310">Et lite egg</text><text x="138" y="335">ligger i underlaget.</text>
  <text x="398" y="310">En krum larve med</text><text x="398" y="335">seks små bein.</text>
  <text x="658" y="310">Kroppen forandres</text><text x="658" y="335">i et beskyttet kammer.</text>
  <text x="918" y="310">Seks bein, antenner</text><text x="918" y="335">og harde dekkvinger.</text>
</g>
</svg>