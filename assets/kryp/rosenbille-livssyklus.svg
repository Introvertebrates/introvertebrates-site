  <path d="M0 -84 C-53 -80 -62 -35 -55 17 C-48 68 -23 87 0 87 C23 87 48 68 55 17 C62 -35 53 -80 0 -84Z" fill="url(#shell)" stroke="#9a6b3b" stroke-width="3"/>
